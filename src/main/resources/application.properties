spring.application.name=organizacao-recursos

# Banco H2 salvo em arquivo local (limpo e sem conflito de migration antiga)
spring.datasource.url=jdbc:h2:file:./data/recursos_app_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e atualiza todas as tabelas automaticamente no H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# CRITICO: Desativa o Flyway no H2 pois a migration V2 usa sintaxe exclusiva de PostgreSQL (btree_gist)
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desativa cache de arquivos estáticos para carregar o novo index.html na hora
spring.web.resources.cache.period=0
spring.devtools.restart.enabled=true

security.jwt.secret=${JWT_SECRET:chave-secreta-padrao-desenvolvimento-32-bytes}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}